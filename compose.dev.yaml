# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose

services:

  frontend-dev:
    build:
      context: ./frontend
      target: development
    environment:
      NODE_ENV: development
    ports:
      - 4205:4200
    expose:
      - 4205
    depends_on:
      backend-dev:
        condition: service_healthy
    volumes:
      - ./frontend/src:/usr/src/app/src

  backend-dev:
    build:
      context: ./backend
      target: development
    environment:
      NODE_ENV: development
    ports:
      - 8880:8880
    expose:
      - 8880
    depends_on:
      mongo:
        condition: service_healthy
      postgres-dev:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://backend-dev:8880/api/healthcheck" ]
      interval: 60s
      timeout: 5s
      retries: 2
    volumes:
      - ./backend/server:/usr/src/app/server
      - ./backend/bin:/usr/src/app/bin
    # command: '/bin/bash -c "sleep 5; mongosh mongodb://user:pass@mongodb --eval \"show dbs;\""'

  postgres-dev:
    container_name: dbpv-container
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbpv
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    expose:
      - 5434
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 2
    volumes:
      - ./data/dev/postgres/pgdata:/var/lib/postgresql/data/pgdata

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: "dbpv"
    ports:
      - 27017:27017
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongo/test --quiet
      interval: 10s
      timeout: 5s
      retries: 2
    volumes:
      - ./data/dev/mongodb:/data/db