# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose

services:

  frontend-qa:
    build:
      context: ./frontend
      target: test
    environment:
      NODE_ENV: production
    ports:
      - 4200:4200
    expose:
      - 4200

  backend-qa:
    build:
      context: ./backend
      target: test
    environment:
      NODE_ENV: production
    ports:
      - 8880:8880
    expose:
      - 8880
    depends_on:
      postgres-qa:
          condition: service_healthy

  postgres-qa:
    container_name: dbpv-container-qa
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbpv
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    expose:
      - 5434
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/qa/postgres/pgdata:/var/lib/postgresql/data/pgdata
