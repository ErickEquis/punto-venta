<div class="row col-2 mx-1 d-flex align-items-start flex-column">
  <div
    *ngFor="let cliente of clientes; let i = index"
    role="button"
    class="text-center my-1 d-flex justify-content-center flex-column position-relative border border-dark"
    style="height: 6rem;"
    (click)="abrirCuenta(i)"
  >
    <button
      type="button"
      class="btn-close position-absolute top-0 end-0 z-index-10"
      aria-label="Close"
      (click)="borrarCliente(i); $event.stopPropagation()"
    ></button>
    <span>Cliente {{ cliente.id }}</span>
    <span>{{ cliente.totalVenta | currency }}</span>
  </div>

  <div
    role="button"
    class="text-center my-1 d-flex justify-content-center flex-column border border-dark"
    style="height: 6rem;"
    (click)="nuevaCuenta()"
  >
    <span>Agregar cuenta</span>
  </div>
</div>

<app-ventas
  *ngFor="let cliente of clientes; let i = index"
  [clienteIndex]="i"
  [hidden]="cliente.id !== clienteVisible"
  (eliminarCuenta)="borrarCliente($event);"
  (totalVenta)="updateTotalVenta($event)"
></app-ventas>
