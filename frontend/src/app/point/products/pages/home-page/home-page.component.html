<div class="row g-3">
  <div class="col-12 col-md-3">
    <div class="card h-100 p-2 clientes-panel">
      <div class="clientes-scroll">
        <div
          *ngFor="let cliente of clientes; let i = index"
          class="card cliente-item text-center mb-2"
          role="button"
          (click)="abrirCuenta(i)"
        >
          <button
            type="button"
            class="btn-close btn-sm position-absolute top-0 end-0"
            aria-label="Close"
            (click)="borrarCliente(i); $event.stopPropagation()"
          ></button>
          <span class="fw-semibold">Cliente {{ cliente.id }}</span>
          <span>{{ cliente.totalVenta | currency }}</span>
        </div>
      </div>
      <div
        role="button"
        class="card cliente-add text-center mt-3"
        (click)="nuevaCuenta()"
      >
        <span>Agregar cuenta</span>
        <span class="material-symbols-outlined fs-2">
          add_circle
        </span>
      </div>
    </div>
  </div>
  <div class="col">
    <app-ventas
      *ngFor="let cliente of clientes; let i = index"
      [clienteIndex]="i"
      [hidden]="cliente.id !== clienteVisible"
      (eliminarCuenta)="borrarCliente($event);"
      (totalVenta)="updateTotalVenta($event)"
    ></app-ventas>
  </div>
</div>
