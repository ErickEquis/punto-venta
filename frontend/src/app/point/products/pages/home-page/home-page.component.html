<div class="row col-2 mx-1 d-flex align-items-start flex-column">
  <div class="overflow-y-auto mt-3 p-0 hide-scrollbar" style="max-height: 80vh;">
    <button
      *ngFor="let cliente of clientes; let i = index"
      type="button"
      class="text-center my-1 d-flex justify-content-center flex-column position-relative border border-dark card w-100"
      style="height: 6rem;"
      (click)="abrirCuenta(i)"
    >
      <button
        type="button"
        class="btn-close position-absolute top-0 end-0 z-index-10"
        aria-label="Close"
        (click)="borrarCliente(i); $event.stopPropagation()"
      ></button>
      <span>Cliente {{ cliente.id }}</span>
      <span>{{ cliente.totalVenta | currency }}</span>
    </button>
  </div>

  <button
    type="button"
    class="text-center my-1 d-flex justify-content-center flex-column border border-dark card w-100"
    style="height: 6rem;"
    (click)="nuevaCuenta()"
  >
    <span>Agregar cuenta</span>
    <span class="material-symbols-outlined" style="font-size: 2rem;">
      add_circle
    </span>
  </button>
</div>

<app-ventas
  *ngFor="let cliente of clientes; let i = index"
  [clienteIndex]="i"
  [hidden]="cliente.id !== clienteVisible"
  (eliminarCuenta)="borrarCliente($event);"
  (totalVenta)="updateTotalVenta($event)"
></app-ventas>
